name: Cut release
# Creates a release tag, writes its notes, and kicks off the image build — but
# only if CI has already passed on the commit being tagged (#765).
#
# Why this exists: tags were cut by hand, which meant remembering to check CI
# first. build-images.yaml's `verify-ci` job is the backstop that refuses to
# PUBLISH an untested commit; this is the front door that stops the bad tag
# being created in the first place, so the failure arrives before the tag
# exists rather than after.
#
# It does NOT prevent someone running `git tag && git push` from a laptop. Only
# a tag ruleset restricting who may create `20*-s*-rc*` can do that. This is the
# paved road, not the fence.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. 202610-s1-rc1 or v1.2.0'
        required: true
        type: string
      base:
        description: 'Branch to cut the tag from'
        required: true
        default: develop
        type: choice
        options: [develop, main]
      dry_run:
        description: 'Check everything and preview the notes, but create nothing'
        type: boolean
        default: false
      skip_ci_check:
        description: 'Tag even if CI has not passed (emergency use only)'
        type: boolean
        default: false

permissions:
  contents: write   # create the tag ref and the release
  actions: write    # read CI runs, and dispatch build-images

jobs:
  cut:
    name: Cut ${{ inputs.tag }} from ${{ inputs.base }}
    runs-on: ubuntu-latest
    steps:
      - name: Cut the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          BASE: ${{ inputs.base }}
          DRY_RUN: ${{ inputs.dry_run }}
          SKIP: ${{ inputs.skip_ci_check }}
        run: |
          set -euo pipefail

          # ── 1. Validate the tag name ──────────────────────────────────────
          # build-images.yaml only fires on these two patterns. A tag outside
          # them would be created here and then never build, which is a worse
          # outcome than refusing it up front.
          if ! printf '%s' "${TAG}" | grep -qE '^(v[0-9]+\.[0-9]+\.[0-9]+|20[0-9]{4}-s[0-9]+-rc[0-9]+)$'; then
            echo "::error title=Bad tag name::'${TAG}' matches neither v*.*.* nor 20*-s*-rc*. build-images.yaml would never fire for it."
            exit 1
          fi

          # ── 2. Refuse to move an existing tag ─────────────────────────────
          if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error title=Tag already exists::${TAG} is already present. Release tags are immutable — cut the next candidate instead (…-rc2, …-rc3)."
            exit 1
          fi

          # ── 3. Resolve the commit being tagged ────────────────────────────
          SHA=$(gh api "repos/${REPO}/commits/${BASE}" --jq '.sha')
          echo "Tagging ${BASE} @ ${SHA}"

          # ── 4. The gate ───────────────────────────────────────────────────
          # Same question build-images.yaml's verify-ci asks, asked earlier:
          # is there a successful ci.yaml run for THIS commit? Fails closed when
          # there is no run at all, which is the realistic accident (a commit CI
          # never saw) rather than a commit it saw and rejected.
          if [ "${SKIP:-false}" = "true" ]; then
            echo "::warning title=CI gate bypassed::Cutting ${TAG} at ${SHA} without checking CI, because skip_ci_check was set."
          else
            runs=$(gh api --paginate \
              "repos/${REPO}/actions/workflows/ci.yaml/runs?head_sha=${SHA}" \
              --jq '.workflow_runs[] | "\(.status)/\(.conclusion // "pending")\t\(.event)\t\(.html_url)"')

            if [ -z "${runs}" ]; then
              echo "::error title=No CI run for this commit::ci.yaml has never run for ${SHA} (tip of ${BASE}). Note that merges into 'feature' do not run CI, so cut releases from develop or main."
              exit 1
            fi

            echo "ci.yaml runs for ${SHA}:"
            echo "${runs}" | sed 's/^/  /'

            if ! echo "${runs}" | grep -q '^completed/success'; then
              echo "::error title=CI did not pass::No successful ci.yaml run exists for ${SHA}. Fix CI on ${BASE} before cutting ${TAG}."
              exit 1
            fi
            echo "CI passed for ${SHA}."
          fi

          # ── 5. Preview the notes ──────────────────────────────────────────
          # Generated from the PRs merged since the previous release, so the
          # description is written by whoever merged rather than assembled here.
          notes=$(gh api "repos/${REPO}/releases/generate-notes" \
            -f tag_name="${TAG}" -f target_commitish="${SHA}" --jq '.body')
          {
            echo "## ${TAG}"
            echo
            echo "Commit \`${SHA}\` from \`${BASE}\`"
            echo
            echo "${notes}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "::notice title=Dry run::All checks passed. ${TAG} was NOT created. The notes preview is in the run summary."
            exit 0
          fi

          # ── 6. Create the tag ─────────────────────────────────────────────
          # A lightweight tag via the API, matching how these tags have always
          # been cut by hand. Deliberately not `git push`: a tag pushed with
          # GITHUB_TOKEN does not trigger `on: push: tags`, so build-images
          # would sit silent. Step 8 dispatches it explicitly instead —
          # workflow_dispatch is an exception to that suppression rule.
          gh api "repos/${REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${SHA}" --silent
          echo "Created tag ${TAG} -> ${SHA}"

          # ── 7. Publish the release notes ──────────────────────────────────
          gh release create "${TAG}" --target "${SHA}" --title "${TAG}" --generate-notes
          echo "Created release ${TAG}"

          # ── 8. Build and publish the images ───────────────────────────────
          gh workflow run build-images.yaml --ref "${TAG}"
          echo "::notice title=Release cut::${TAG} created at ${SHA}; build-images.yaml dispatched against the tag."
